[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "DnA Workflows"
version = "0.2.0"
description = "Plugin-first integration workflow platform with operational lifecycle (freeze / investigate / unpause)."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "pyjwt[crypto]>=2.8",
    "jsonschema>=4.20",
    "pyyaml>=6.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
rabbitmq = ["aio-pika>=9.4"]
servicebus = ["azure-servicebus>=7.12"]
# OTel pinned to 1.44.x: the Azure Monitor exporter (1.0.0b57) requires exactly that line (see CHANGELOG D-031)
otel = ["opentelemetry-api~=1.44.0", "opentelemetry-sdk~=1.44.0", "opentelemetry-exporter-otlp-proto-http~=1.44.0"]
azure-monitor = ["azure-monitor-opentelemetry-exporter>=1.0.0b57", "opentelemetry-sdk~=1.44.0"]
prometheus = ["prometheus-client>=0.20"]
ai = ["agent-framework-core>=1.0"]
forecasting = ["duckdb>=1.1"]
mcp = ["mcp>=2.0"]
postgres = ["psycopg[binary]>=3.2", "psycopg-pool>=3.2"]
api = ["fastapi>=0.110", "uvicorn>=0.29"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "pytest-cov>=5", "httpx>=0.27", "pgserver>=0.1"]
all = ["DnA Workflows[rabbitmq,servicebus,otel,azure-monitor,prometheus,ai,api,forecasting,mcp,postgres]"]

# Built-in features are discovered the same way third-party plugins are (P0.3).
[project.entry-points."DnA Workflows.features"]
"runtime" = "DnA Workflows.runtime.feature:RuntimeFeature"
"http" = "DnA Workflows.activities.http:HttpFeature"
"persistence.memory" = "DnA Workflows.persistence.memory:InMemoryPersistenceFeature"
"persistence.sqlite" = "DnA Workflows.persistence.sqlite:SqlitePersistenceFeature"
"persistence.postgres" = "DnA Workflows.persistence.postgres:PostgresPersistenceFeature"
"resilience" = "DnA Workflows.resilience.feature:ResilienceFeature"
"messaging" = "DnA Workflows.messaging.feature:MessagingFeature"
"messaging.inmemory" = "DnA Workflows.messaging.providers.inmemory:InMemoryTransportFeature"
"messaging.rabbitmq" = "DnA Workflows.messaging.providers.rabbitmq:RabbitMqTransportFeature"
"messaging.servicebus" = "DnA Workflows.messaging.providers.servicebus:ServiceBusTransportFeature"
"observability" = "DnA Workflows.observability.feature:ObservabilityFeature"
"observability.prometheus" = "DnA Workflows.observability.prometheus:PrometheusFeature"
"observability.otel" = "DnA Workflows.observability.otel:OpenTelemetryFeature"
"observability.azure_monitor" = "DnA Workflows.observability.azure_monitor:AzureMonitorFeature"
"ai" = "DnA Workflows.ai.feature:AiFeature"
"forecasting" = "DnA Workflows.forecasting.service:ForecastingFeature"
"authoring" = "DnA Workflows.authoring:AuthoringFeature"
"security" = "DnA Workflows.security:SecurityFeature"
"mcp" = "DnA Workflows.mcpserver:McpFeature"
"api" = "DnA Workflows.api.feature:ApiFeature"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-q"
markers = [
    "rabbitmq: requires a real RabbitMQ broker (DnA Workflows_TEST_RABBITMQ_URL)",
    "servicebus: requires a real Azure Service Bus (DnA Workflows_TEST_SERVICEBUS_CONNECTION)",
]

[tool.coverage.run]
source = ["DnA Workflows"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.$",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "B"]
ignore = ["E501", "B008", "B010"]
