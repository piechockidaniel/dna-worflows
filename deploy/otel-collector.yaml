# DnA Workflows → OTLP/HTTP → collector → traces to Tempo, logs (journal events) to Loki.
receivers:
  otlp:
    protocols:
      http: {endpoint: 0.0.0.0:4318}
processors:
  batch: {}
exporters:
  otlp/tempo:
    endpoint: tempo:4317
    tls: {insecure: true}
  otlphttp/loki:
    endpoint: http://loki:3100/otlp
service:
  pipelines:
    traces: {receivers: [otlp], processors: [batch], exporters: [otlp/tempo]}
    logs: {receivers: [otlp], processors: [batch], exporters: [otlphttp/loki]}
