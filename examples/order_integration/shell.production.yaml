# Production-like composition: PostgreSQL, RabbitMQ, Keycloak, Studio, MCP, forecasting, Grafana stack.
name: order-integration
features:
  persistence.postgres: {dsn: "${DnA Workflows_PG}", schema_name: "${DnA Workflows_SCHEMA:-DnA Workflows}"}
  runtime: {definitions: [./workflows], host_id: "${HOSTNAME:-DnA Workflows-1}"}
  resilience:
    release:
      rules:
        - {pattern: "http:erp", strategy: probe-recommend, options: {successes_required: 3, interval: 30}}
  messaging:
    endpoints:
      orders:
        transport: rabbitmq
        address: DnA Workflows.orders
        consume: true
        options: {exchange: shop, exchange_type: topic, bind_keys: [order.placed], dead_letter_exchange: shop.dlx}
      confirmations:
        transport: rabbitmq
        address: DnA Workflows.confirmations
        options: {exchange: shop, routing_key: order.confirmed}
  messaging.rabbitmq: {url: "${RABBITMQ_URL}"}
  http:
    dependencies:
      erp: {base_url: "${ERP_URL}", health_url: "${ERP_URL}/health"}
  security:
    issuer: "${KEYCLOAK_ISSUER}"
    jwks_url: "${KEYCLOAK_JWKS:-}"
    audience: DnA Workflows-api
  authoring: {review_required: true, four_eyes: true}
  forecasting: {database: "${DnA Workflows_HISTORY:-/data/history.duckdb}"}
  mcp: {resource_url: "${DnA Workflows_PUBLIC_URL:-http://localhost:8080}/mcp"}
  observability: {configure_logging: true}
  observability.prometheus: {}
  observability.otel: {service_name: order-integration, otlp_endpoint: "${OTLP_ENDPOINT:-http://localhost:4318}"}
  api:
    port: 8080
    studio_dir: /app/studio
    studio_config:
      keycloak: {url: "${KEYCLOAK_PUBLIC_URL:-http://localhost:8180}", realm: DnA Workflows, clientId: DnA Workflows-studio}
